[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-skill-entity-extractor"
version = "0.1.0"
description = "An NLP pipeline for extracting structured entities from resumes."
requires-python = ">=3.11,<3.14"
dependencies = [
    "spacy>=3.8,<4.0",
    "PyMuPDF>=1.24,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
